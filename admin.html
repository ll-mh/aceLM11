<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站点留言后台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box;font-family: system-ui, sans-serif;margin:0;padding:0}
    body {background:#111;color:#eee;padding:24px;max-width:1100px;margin:0 auto}
    .card {background:#1b1b1b;padding:20px;border-radius:12px;margin:16px 0;border:1px solid #333}
    h1,h2 {margin-bottom:16px}
    input {width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;outline:none;font-size:16px}
    button {padding:9px 16px;border:none;border-radius:6px;cursor:pointer;margin:4px;background:#2563eb;color:#fff;font-size:15px}
    button.del {background:#dc2626}
    button:hover {opacity:0.9}
    .msg-item {padding:12px 0;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .msg-info {flex:1}
    .tip {color:#aaa;margin:10px 0}
    #loginBox {max-width:600px}
  </style>
</head>
<body>
  <h1>网站留言后台</h1>
  <div class="tip" id="tip"></div>

  <!-- 简易密码登录框 -->
  <div class="card" id="loginBox">
    <h2>管理员登录</h2>
    <input type="password" id="adminPwd" placeholder="输入管理员密码">
    <button onclick="checkPwd()">登录</button>
  </div>

  <!-- 留言面板（登录成功才显示） -->
  <div id="mainBox" style="display:none">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>留言列表</h2>
        <button onclick="loadList()">刷新</button>
      </div>
      <div id="listWrap"></div>
    </div>
  </div>

<script>
// ========== 配置区 ==========
const SUPABASE_URL = "https://ygovrgozpjbbteigdpxq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnb3Znb3pwamJidGVpZ2RweHEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcyODA4Njk0NCwiZXhwIjoxOTkzNjYyOTQ0fQ.nyAF5WvXaY8LtgB9MdXYOxfbyAvZuwUzpDVQBlE_K8k";
const TABLE_NAME = "messages";
const ADMIN_PASSWORD = "aceLM21";
// ============================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tipDom = document.getElementById("tip");
const loginBox = document.getElementById("loginBox");
const mainBox = document.getElementById("mainBox");
const listWrap = document.getElementById("listWrap");

function setTip(text){
  tipDom.innerText = text;
}

// 密码校验
function checkPwd(){
  const p = document.getElementById("adminPwd").value.trim();
  if(p === ADMIN_PASSWORD){
    loginBox.style.display = "none";
    mainBox.style.display = "block";
    setTip("登录成功");
    loadList();
  }else{
    setTip("密码错误！");
  }
}

// 读取留言
async function loadList(){
  setTip("加载中...");
  const {data,error} = await supabase
    .from(TABLE_NAME)
    .select("*")
    .order("created_at",{ascending:false});
  if(error){
    setTip("读取失败："+error.message);
    return;
  }
  listWrap.innerHTML = "";
  if(data.length === 0){
    listWrap.innerText = "暂无留言";
    return;
  }
  data.forEach(item=>{
    const div = document.createElement("div");
    div.className = "msg-item";
    div.innerHTML = `
      <div class="msg-info">
        <div><b>${item.name || "匿名"}</b>｜${new Date(item.created_at).toLocaleString()}</div>
        <div style="margin-top:6px">${item.content}</div>
      </div>
      <button class="del" onclick="delMsg('${item.id}')">删除</button>
    `;
    listWrap.appendChild(div);
  })
  setTip(`共 ${data.length} 条留言`);
}

// 删除留言
async function delMsg(id){
  if(!confirm("确定删除这条留言吗？")) return;
  const {error} = await supabase.from(TABLE_NAME).delete().eq("id",id);
  if(error){
    setTip("删除失败："+error.message);
  }else{
    setTip("已删除");
    loadList();
  }
}
</script>
</body>
</html>
